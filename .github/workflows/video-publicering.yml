name: video-publicering
# Mejlar publiceringspaketet för teaser-videon (YouTube, LinkedIn, X) med videon bifogad.
# Publicerar inget själv: YouTube och LinkedIn kräver kontots inloggning, X API saknar krediter.
# Körs manuellt: gh workflow run "video-publicering" --ref main
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: video-publicering, cancel-in-progress: false}
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/video_kit.py
        env:
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
