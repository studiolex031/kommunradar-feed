name: Uppföljning vinnar-leads

# Mejl 2 (dag 4) och mejl 3 (dag 9) till dem som fick mejl 1 och inte svarat.
# Mejl 1 skickas av outbound-vinnare.yml.

on:
  schedule: [{cron: "30 6 * * 1-5"}]   # vardagar 07:30 svensk tid
  workflow_dispatch:
    inputs:
      limit:
        description: "Uppföljningar i den här körningen (tak: FOLLOWUP_MAX_DAG)"
        default: "50"

permissions: {contents: write}
concurrency: {group: followup-vinnare, cancel-in-progress: false}

jobs:
  skicka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Skicka nästa uppföljning
        run: python scripts/followup_send.py --limit "$LIMIT" --report
        env:
          LIMIT: ${{ inputs.limit || '50' }}
          FOLLOWUP_MAX_DAG: "50"
          FOLLOWUP_MAX_TIMME: "60"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          REPORT_TO: ${{ secrets.REPORT_TO }}

      - name: Spara state och eventuell spärr
        if: always()
        run: |
          git config user.name "outbound-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/outbound/
          git diff --staged --quiet && echo "Ingen ny state" && exit 0
          git commit -m "Uppföljning: $(date -u +%F)"
          git pull --rebase origin main
          git push
