name: diag-missade
on:
  push:
    branches: [diag/missade-form]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" "https://kommunradar.online/?n=$GITHUB_RUN_ID" -o p.html
          wc -c p.html
          echo "=== kontext kring missade ==="
          python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'missade',h):
              print('-----',m.start()); print(h[max(0,m.start()-3000):m.start()+1500])
          print('=== forms ===')
          for m in re.finditer(r'<form[^>]*>',h): print(m.group(0))
          print('=== action/fetch/php ===')
          for m in re.finditer(r'(action=\S+|fetch\([^)]{0,200}\)|[\w/.-]+\.php[^\s"\']*|location(?:\.href)?\s*=\s*[^;]{0,200}|assign\([^)]{0,200}\))',h): print(m.group(0))
          PY
          for u in / /missade /missade/ /missade.php /api/ /lead.php /signup.php /subscribe.php; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://kommunradar.online$u)"; done
