name: diag-missade
on:
  push:
    branches: [diag/missade-form]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://login.kommunradar.online/ https://login.kommunradar.online/search https://login.kommunradar.online/search/ http://login.kommunradar.online/search https://kommunradar.online/search; do
            echo "== $u"; curl -sS -o /tmp/b -D - "$u" | grep -Ei "^(HTTP|server|location|x-powered)" ; head -c 400 /tmp/b | tr '\n' ' '; echo
          done
          dig +short login.kommunradar.online; dig +short kommunradar.online; dig +short CNAME login.kommunradar.online
