name: publicera-rotfilerna
# Publicerar sajtens rotfiler (allt utom index.html) till Simply.com när de ändras i main.
# index.html ägs av pricing-plans, som utgår från den live-fil som redan finns på servern — den får
# aldrig skrivas över härifrån, annars raderas prisplanerna och Blueberry-avsnittet.
on:
  push:
    branches: [main]
    paths:
      - "robots.txt"
      - "config.js"
      - "site.js"
      - "veckobrev.html"
      - "tack-veckobrev.html"
      - "tack.html"
      - "villkor.html"
      - "integritet.html"
      - "legal.css"
      - "favicon.svg"
      - "sitemap.xml"
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: site-root, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}  # tomt = hoppa över publicering
    steps:
      - uses: actions/checkout@v4
      - name: Publicera rotfiler
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          sudo apt-get install -y -qq lftp
          files=".htaccess robots.txt config.js site.js veckobrev.html tack-veckobrev.html tack.html villkor.html integritet.html legal.css favicon.svg sitemap.xml"
          for f in $files; do [ -f "$f" ] || { echo "::error::Saknar $f"; exit 1; }; done
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 3; \
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\"; \
            mput -O ${FTP_DIR} $files; \
            mirror -R --parallel=4 app ${FTP_DIR}app"
      - name: Kontrollera att allt är ute
        if: ${{ env.FTP_SERVER != '' }}
        run: |
          sleep 5
          fail=0
          for u in veckobrev.html tack-veckobrev.html robots.txt config.js app/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://kommunradar.online/$u?n=$GITHUB_RUN_ID")
            echo "$u -> $code"
            [ "$code" = "200" ] || fail=1
          done
          curl -sS "https://kommunradar.online/robots.txt?n=$GITHUB_RUN_ID" | grep -q "sitemap-atlas-3.xml" \
            && echo "robots.txt: alla sitemaps med" || { echo "::error::robots.txt saknar atlas-sitemaps"; fail=1; }
          [ "$fail" = "0" ] || exit 1
