name: x-dagligt
# Ett eget inlägg på X varje vardag (07:41 vintertid) från färsk leads.json, plus annonsmaterial till REPORT_TO.
# Saknas X-nycklarna byggs och mejlas inlägget men postas inte.
on:
  schedule: [{cron: "41 6 * * 1-5"}]
  workflow_dispatch:
    inputs:
      dry_run: {description: "Bara bygg, posta och mejla inget", type: boolean, default: false}
permissions: {contents: read}
concurrency: {group: x-dagligt, cancel-in-progress: false}
jobs:
  gate:
    # GitHubs schema startar ofta timmar sent. Den riktiga starten görs av Vercel Cron
    # (dispatch/api/dispatch.py) kl. 06–07. En schemalagd körning hoppar därför över sig
    # själv om workflowen redan startats i dag; manuella körningar körs alltid.
    runs-on: ubuntu-latest
    permissions: {actions: read}
    outputs: {run: "${{ steps.g.outputs.run }}"}
    steps:
      - id: g
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(python3 -c "from datetime import datetime as d; from zoneinfo import ZoneInfo as Z; print(d.now(Z('Europe/Stockholm')).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(Z('UTC')).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          wf=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=>=$since&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length")
          echo "Körningar i dag före denna: $n"
          [ "$n" = "0" ] && echo run=true >> "$GITHUB_OUTPUT" || echo run=false >> "$GITHUB_OUTPUT"
  post:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: today
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Redan postat i dag?
        id: done
        uses: actions/cache/restore@v4
        with: {path: x-posted, key: "x-posted-${{ steps.today.outputs.d }}"}
      - name: Installera bildrendering
        if: ${{ steps.done.outputs.cache-hit != 'true' }}
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Återställ X-token
        if: ${{ steps.done.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: x-token
          key: "x-token-${{ github.run_id }}"
          restore-keys: "x-token-"
      - name: Bygg och posta
        if: ${{ steps.done.outputs.cache-hit != 'true' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_TOKEN_STATE: x-token/state.json
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/x_daily.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Spara X-token
        if: ${{ steps.done.outputs.cache-hit != 'true' && !inputs.dry_run && always() }}
        uses: actions/cache/save@v4
        with:
          path: x-token
          key: "x-token-${{ github.run_id }}"
      - name: Markera dagen som postad
        if: ${{ steps.done.outputs.cache-hit != 'true' && !inputs.dry_run }}
        run: |
          if [ -f x-out/posted.txt ]; then mkdir -p x-posted && date > x-posted/at
          else echo "Inte postat i dag — dagen markeras inte, nästa körning försöker igen"; fi
      - if: ${{ steps.done.outputs.cache-hit != 'true' && !inputs.dry_run && hashFiles('x-posted/at') != '' }}
        uses: actions/cache/save@v4
        with: {path: x-posted, key: "x-posted-${{ steps.today.outputs.d }}"}
