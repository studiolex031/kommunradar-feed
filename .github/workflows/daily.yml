name: kommunradar-daily
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: cp leads.json "$RUNNER_TEMP/prev.json"
      - run: python feed.py
      - name: Mejla prenumeranter
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: python digest.py --prev "$RUNNER_TEMP/prev.json"
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add leads.json && git commit -m "daglig uppdatering" || exit 0
          git push
