name: kommunradar-daily
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kör utan kundmejl, FTP-publicering och GitHub-commit (standard)"
        required: false
        type: boolean
        default: true
permissions: {contents: write}
jobs:
  gate:
    # GitHubs schema startar ofta timmar sent. Den riktiga starten görs av Vercel Cron
    # (dispatch/api/dispatch.py) kl. 06–07. En schemalagd körning hoppar därför över sig
    # själv om workflowen redan startats i dag; manuella körningar körs alltid.
    runs-on: ubuntu-latest
    permissions: {actions: read}
    outputs: {run: "${{ steps.g.outputs.run }}"}
    steps:
      - id: g
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(python3 -c "from datetime import datetime as d; from zoneinfo import ZoneInfo as Z; print(d.now(Z('Europe/Stockholm')).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(Z('UTC')).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          wf=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=>=$since&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length")
          echo "Körningar i dag före denna: $n"
          [ "$n" = "0" ] && echo run=true >> "$GITHUB_OUTPUT" || echo run=false >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}  # tomt = hoppa över publicering till Simply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Kontrollera nycklar (bara vid manuell körning, skickar inget mejl)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: python digest.py --check
      - run: cp leads.json "$RUNNER_TEMP/prev.json"
      - run: python feed.py
      - name: Mejla prenumeranter
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Manuell kontroll: inga kundmejl skickas."
            python digest.py --prev "$RUNNER_TEMP/prev.json" --dry-run
          else
            python digest.py --prev "$RUNNER_TEMP/prev.json"
          fi
      - name: Publicera färsk data på kommunradar.online (Simply.com)
        if: ${{ env.FTP_SERVER != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
        run: curl --fail --ssl-reqd -sS -T leads.json --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/${FTP_DIR}leads.json"
      - name: Spara uppdaterad feed i GitHub
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add leads.json && git commit -m "daglig uppdatering" || exit 0
          git push
