name: outbound-vinnare
# Skickar det personliga första-mejlet till bolag som nyss vunnit en svensk
# offentlig upphandling (scripts/outbound_send.py).
#
# En batch per vardag, inte hela listan på en gång: en brevlåda som skickar
# hundratals kalla mejl i en burst blir blockerad. Det hände 2026-11-18 —
# Simply.com spärrade kontot efter 149 mejl på två timmar, och deras policy
# förbjuder uttryckligen cold mailing på smtp.simply.com. Workflowen är därför
# AVSTÄNGD tills SMTP flyttats till en transaktionell leverantör (Brevo, 0 kr).
# Se kommunradar/outbound/vinnar-leads.md.
on:
  schedule: [{cron: "0 6 * * 1-5"}]   # vardagar 07:00 svensk tid
  workflow_dispatch:
    inputs:
      limit:
        description: "Mejl i den här körningen (tak: OUTBOUND_MAX_DAG)"
        default: "20"
      days:
        description: "Lookback i dagar (fler = större lista)"
        default: "7"
permissions: {contents: write}
concurrency: {group: outbound-vinnare, cancel-in-progress: false}
jobs:
  skicka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Skicka nästa batch
        run: python scripts/outbound_send.py --fresh --limit "$LIMIT" --days "$DAYS" --report
        env:
          LIMIT: ${{ inputs.limit || '20' }}
          DAYS: ${{ inputs.days || '7' }}
          OUTBOUND_MAX_DAG: "20"
          OUTBOUND_MAX_TIMME: "30"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
      - name: Spara state och eventuell spärr
        if: always()
        run: |
          git config user.name "outbound-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/outbound/
          git diff --staged --quiet && echo "Ingen ny state" && exit 0
          git commit -m "Outbound: batch $(date -u +%F)"
          git pull --rebase origin main
          git push
