name: linkedin-post
# Postar en färdig text på LinkedIn direkt via LinkedIns API (scripts/linkedin_post.py).
# Ersätter Typefully för LinkedIn. Körs bara manuellt: varje inlägg ska vara godkänt av Alexander.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Textfil i repot att posta (t.ex. social/2026-11-25-linkedin-black-week.txt)"
        required: true
      dry_run:
        description: "Bygg bara inlägget, posta inget"
        type: boolean
        default: false
permissions: {contents: read}
concurrency: {group: linkedin-post, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Posta på LinkedIn
        env:
          FILE: ${{ inputs.file }}
          DRY: ${{ inputs.dry_run }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          case "$FILE" in social/*.txt) ;; *) echo "::error::Bara filer under social/*.txt"; exit 1;; esac
          test -s "$FILE"
          args=(--file "$FILE"); [ "$DRY" = "true" ] && args+=(--dry-run)
          python scripts/linkedin_post.py "${args[@]}"
