<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kommunradar</title>
<style>
:root{--bg:#f6f5f1;--fg:#1b1a18;--mut:#6a675f;--card:#fff;--bd:#e1ded5;--ac:#1f5fbf;--ok:#2d7a4b;--wa:#b5651d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--fg:#e9e8e4;--mut:#9a9890;--card:#1d1f22;--bd:#33363a;--ac:#6ea2f0;--ok:#6cc08b;--wa:#e0a060;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:22px;margin:0}.s{color:var(--mut);font-size:13px;margin:2px 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--mut);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.k b{display:block;font-size:24px}
.r{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;margin-bottom:8px}
.r a{color:var(--ac);font-weight:600;text-decoration:none}.m{color:var(--mut);font-size:13px;margin-top:3px}
.sc{float:right;font-weight:700;border-radius:6px;padding:1px 8px;border:1px solid var(--bd)}.hi{color:var(--ok);border-color:var(--ok)}.md{color:var(--wa);border-color:var(--wa)}
.na{color:var(--wa)}
</style></head><body><main>
<h1>Kommunradar</h1><p class="s" id="up">Laddar…</p>
<nav id="nav"></nav><div id="v"></div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[],view='Bevakning',q='',min=0;
const V=['Bevakning','Affärsvy','Inköpssystem','Prospekt'];
const dl=l=>{const d=new Date((l.deadline||'').slice(0,10));return isNaN(d)?null:Math.ceil((d-new Date())/864e5)};
const ok=(x,n)=>x?E(x):`<span class="na">${n} saknas</span>`;
const row=l=>{const d=dl(l);return `<div class="r"><span class="sc ${l.score>=50?'hi':l.score>=25?'md':''}">${l.score}</span><a href="${E(l.url)}" target="_blank" rel="noopener">${ok(l.title,'titel')}</a><div class="m">${ok(l.buyer,'köpare')} · publicerad ${ok((l.published||'').slice(0,10),'datum')} · ${d===null?'<span class="na">deadline saknas</span>':d>=0?'deadline om '+d+' dagar':'deadline passerad'}${l.cpv?.length?' · CPV '+E(l.cpv.slice(0,3).join(', ')):''}</div></div>`};
const hay=l=>(l.title+' '+l.buyer).toLowerCase();
function draw(){
 $('nav').innerHTML=V.map(n=>`<button class="${n===view?'on':''}" data-v="${n}">${n}</button>`).join('');
 let f=L.filter(l=>l.score>=min&&(!q||hay(l).includes(q))),h='';
 const bar=`<div class="bar"><input id="q" type="search" placeholder="Sök köpare eller titel" value="${E(q)}"><label>Minsta poäng <input id="mn" type="number" min="0" max="100" value="${min}" style="width:70px"></label><span>${f.length} träffar</span></div>`;
 if(view==='Bevakning')h=bar+f.map(row).join('');
 if(view==='Affärsvy'){
  const soon=L.filter(l=>{const d=dl(l);return d!==null&&d>=0&&d<=14}).length;
  h=`<div class="kp"><div class="k"><b>${L.length}</b>upphandlingar</div><div class="k"><b>${L.filter(l=>l.score>=50).length}</b>hög poäng (50+)</div><div class="k"><b>${soon}</b>deadline inom 14 dagar</div><div class="k"><b>${new Set(L.map(l=>l.buyer)).size}</b>unika köpare</div></div><h3>Topp 10</h3>`+L.slice(0,10).map(row).join('');
 }
 if(view==='Inköpssystem'){
  const r=/ekonomi|affärssystem|inköp|faktura|upphandlingssystem|peppol/;
  h=bar+f.filter(l=>r.test(hay(l))||l.cpv?.some(c=>c.startsWith('48')||c.startsWith('72'))).map(row).join('')||'Inga träffar.';
 }
 if(view==='Prospekt'){
  const g={};f.forEach(l=>{const b=l.buyer||'(okänd köpare)';(g[b]=g[b]||[]).push(l)});
  h=bar+Object.entries(g).sort((a,b)=>Math.max(...b[1].map(x=>x.score))-Math.max(...a[1].map(x=>x.score))).slice(0,40).map(([b,a])=>`<div class="r"><span class="sc">${Math.max(...a.map(x=>x.score))}</span><b>${E(b)}</b><div class="m">${a.length} upphandling(ar)</div><button class="b cp" data-b="${E(b)}" data-t="${E(a[0].title)}" style="margin-top:6px">Kopiera mejlutkast</button></div>`).join('');
 }
 $('v').innerHTML=h;
 const qi=$('q');if(qi)qi.oninput=e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;draw();$('q').focus();$('q').setSelectionRange(p,p)};
 const mn=$('mn');if(mn)mn.onchange=e=>{min=+e.target.value||0;draw()};
}
document.addEventListener('click',e=>{
 const n=e.target.closest('nav button');if(n){view=n.dataset.v;draw()}
 const c=e.target.closest('.cp');if(c){const t=`Hej,\n\nJag såg att ${c.dataset.b} nyligen publicerat upphandlingen "${c.dataset.t}". Vi hjälper offentliga verksamheter att ta emot och skicka e-fakturor via Peppol, utan att byta ekonomisystem.\n\nHar ni 15 minuter för ett kort samtal i veckan?\n\nVänliga hälsningar\nAlexander`;try{navigator.clipboard.writeText(t);c.textContent='Kopierat ✓'}catch(_){c.textContent='Kunde inte kopiera'}}
});
fetch('leads.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{L=d.leads||[];$('up').textContent=`Uppdaterad ${(d.updated||'').slice(0,16).replace('T',' ')} UTC · ${L.length} upphandlingar från TED`;draw()}).catch(()=>{$('up').textContent='Kunde inte läsa leads.json. Öppna sidan via GitHub Pages, inte som lokal fil.'});
</script></main></body></html>
